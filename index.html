<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%BF</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============================================================
       ⚠️ 반드시 아래 주소를 본인의 Apps Script 배포 주소로 바꿔주세요.
       Apps Script 편집기 → 배포 → 배포 관리 → 웹앱 URL (.../exec로 끝남)
       app.js가 이 값을 읽어서 모든 fetch() 요청을 보냅니다.
  ============================================================ -->
  <script>
    window.API_BASE_URL = 'https://script.google.com/macros/s/AKfycbwT2f-9Sp6HS7OPvzECN7bdwtIp_r58FBB6wqrjrRd3l8eBUTLj0fh5Zk3MvWTgUaYk/exec';
  </script>

  <!-- ---------------- 로그인 화면 ---------------- -->
  <div id="loginView">
    <div class="login-card">
      <h1 id="loginTitle">🌿 Task Manager</h1>
      <p class="sub">Please log in to continue</p>
      <input id="loginId" placeholder="Username" autocomplete="username">
      <input id="loginPw" type="password" placeholder="Password" autocomplete="current-password">
      <label class="remember-id-row">
        <input type="checkbox" id="rememberIdChk"> Remember ID
      </label>
      <button class="btn-primary" id="loginBtn"><span class="i18n-tip" data-tip="로그인">Log In</span></button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- ---------------- 로그인 후 메인 화면 ---------------- -->
  <div id="appView" class="hidden">
    <div class="sidebar" id="sidebar">
      <div class="brand">🌿 Task Manager</div>
      <div class="nav-item active" data-view="dashboard">📊 <span class="i18n-tip" data-tip="대시보드">Dashboard</span></div>
      <div class="nav-item" data-view="today">📌 <span class="i18n-tip" data-tip="오늘의 업무">Today's Tasks</span></div>
      <div class="nav-item" data-view="todo">🔵 <span class="i18n-tip" data-tip="할 일">To Do</span></div>
      <div class="nav-item" data-view="progress">🟢 <span class="i18n-tip" data-tip="진행 중">In Progress</span></div>
      <div class="nav-item" data-view="review">🟣 <span class="i18n-tip" data-tip="검토할 일">To Review</span></div>
      <div class="nav-item" data-view="check">🟡 <span class="i18n-tip" data-tip="체크할 일">To Check</span></div>
      <div class="nav-item" data-view="hold">⏸ <span class="i18n-tip" data-tip="보류">On Hold</span></div>
      <div class="nav-item" data-view="done">✅ <span class="i18n-tip" data-tip="완료">Completed</span></div>
      <div class="nav-item" data-view="overdue">⚠ <span class="i18n-tip" data-tip="기한 초과">Overdue</span></div>
      <div class="nav-item" data-view="all">📁 <span class="i18n-tip" data-tip="전체 업무">All Tasks</span></div>
      <div class="nav-item" data-view="calendar">🗓 <span class="i18n-tip" data-tip="캘린더">Calendar</span></div>
      <div class="nav-item" data-view="words">📖 <span class="i18n-tip" data-tip="단어">Words</span></div>
      <div class="nav-item" data-view="settings">⚙ <span class="i18n-tip" data-tip="설정">Settings</span></div>
    </div>

    <div class="main">
      <div class="topbar">
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <input type="search" placeholder="Use the search box at the top of each screen" disabled style="opacity:.5;">
        <div class="user-area">
          👤 <span id="userLabel"></span>
          <span class="user-sep">|</span>
          <button class="logout-link" onclick="doLogout()"><span class="i18n-tip" data-tip="로그아웃">Log Out</span></button>
        </div>
      </div>
      <div class="content">
        <!-- 대시보드 -->
        <div id="view-dashboard" class="view-panel hidden"></div>

        <!-- 업무 분류 화면들 -->
        <div id="view-today" class="view-panel hidden"></div>
        <div id="view-todo" class="view-panel hidden"></div>
        <div id="view-progress" class="view-panel hidden"></div>
        <div id="view-review" class="view-panel hidden"></div>
        <div id="view-check" class="view-panel hidden"></div>
        <div id="view-hold" class="view-panel hidden"></div>
        <div id="view-done" class="view-panel hidden"></div>
        <div id="view-overdue" class="view-panel hidden"></div>
        <div id="view-all" class="view-panel hidden"></div>

        <!-- 달력 -->
        <div id="view-calendar" class="view-panel hidden"></div>

        <!-- 단어 -->
        <div id="view-words" class="view-panel hidden"></div>

        <!-- 설정 -->
        <div id="view-settings" class="view-panel hidden"></div>
      </div>
    </div>

    <button class="fab" id="fabBtn">+</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
